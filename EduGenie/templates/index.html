<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        EduGenie - AI Learning Assistant
    </title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>

<main class="app-shell">

    <!-- HEADER -->

    <header class="hero">

        <div>

            <p class="eyebrow">
                AI-POWERED LEARNING
            </p>

            <h1>
                EduGenie
            </h1>

            <p class="subtitle">
                Ask questions, understand concepts,
                generate quizzes, summarize content,
                and build learning paths.
            </p>

        </div>

        <div
            class="status"
            id="status"
        >
            Ready
        </div>

    </header>


    <!-- INPUT CARD -->

    <section class="card">

        <label for="task">
            Choose a task
        </label>

        <select id="task">

            <option value="qa">
                Question & Answer
            </option>

            <option value="explain">
                Explain a Topic
            </option>

            <option value="quiz">
                Generate Quiz
            </option>

            <option value="summarize">
                Summarize
            </option>

            <option value="recommendations">
                Learning Path
            </option>

        </select>


        <label for="inputText">
            Your input
        </label>

        <textarea
            id="inputText"
            rows="9"
            placeholder="Ask a question or paste educational text..."
        ></textarea>


        <div class="actions">

            <button
                id="submitBtn"
                type="button"
            >
                Generate
            </button>


            <button
                id="clearBtn"
                type="button"
                class="secondary"
            >
                Clear
            </button>

        </div>

    </section>


    <!-- RESULT -->

    <section class="card result-card">

        <div class="result-header">

            <h2>
                Result
            </h2>

            <button
                id="copyBtn"
                type="button"
                class="secondary small"
            >
                Copy
            </button>

        </div>


        <div
            id="result"
            class="result empty"
        >
            Your generated result will appear here.
        </div>

    </section>

</main>


<script src="/static/app.js"></script>

</body>

</html>
